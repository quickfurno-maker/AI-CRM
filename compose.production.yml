name: crm-ai

x-app-common: &app-common
  restart: unless-stopped
  env_file:
    - ${PRODUCTION_ENV_FILE:-.env.production}
  networks:
    - app
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  api:
    <<: *app-common
    image: crm-ai-api:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "127.0.0.1:${API_BIND_PORT:-4000}:4000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    <<: *app-common
    image: crm-ai-web:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_BASE_URL: http://api:4000/v1
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *app-common
    image: crm-ai-worker:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  migrate:
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    image: crm-ai-migration:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    profiles:
      - ops

networks:
  app:
    driver: bridge

volumes:
  redis_data:
