name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: UI quality gate
        run: npm run ui:quality

      - name: Tests
        run: npm test

      - name: Foundation e2e
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_USER: crm_ai
          POSTGRES_PASSWORD: crm_ai_ci
          POSTGRES_DB: crm_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_ai -d crm_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://crm_ai:crm_ai_ci@127.0.0.1:5432/crm_ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build production migration runner
        run: npm run build -w @crm-ai/api
      - name: Apply migrations with production runner
        run: node apps/api/dist/platform/database/migrate-runner.js
      - name: Prove migration idempotence
        run: node apps/api/dist/platform/database/migrate-runner.js
      - name: Verify PostgreSQL schema
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const tables = await client.query(
            "select count(*)::int as count from pg_tables where schemaname = 'public'"
          );
          const vector = await client.query(
            "select extversion from pg_extension where extname = 'vector'"
          );
          const subscriptionColumns = await client.query(
            "select column_name from information_schema.columns where table_schema='public' and table_name='subscriptions'"
          );
          const paymentTables = await client.query(
            "select tablename from pg_tables where schemaname='public' and tablename = any(array['saas_payment_intents','saas_payment_gateway_events','saas_payment_refunds','saas_payment_mandates']) order by tablename"
          );
          const count = Number(tables.rows[0]?.count ?? 0);
          const columns = new Set(subscriptionColumns.rows.map((row) => row.column_name));
          console.log({ publicTables: count, vector: vector.rows[0]?.extversion, subscriptionColumns: [...columns].sort(), paymentTables: paymentTables.rows.map((row) => row.tablename) });
          if (count !== 141) throw new Error(`Expected 141 public tables, found ${count}.`);
          for (const required of ['currency', 'current_period_start', 'current_period_end', 'grace_ends_at', 'pending_plan_id']) {
            if (!columns.has(required)) throw new Error(`Missing subscriptions.${required}`);
          }
          if (paymentTables.rows.length !== 4) throw new Error('Payment gateway runtime tables are incomplete.');
          if (!vector.rows[0]) throw new Error('pgvector extension is not installed.');
          await client.end();
          NODE

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t crm-ai-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t crm-ai-web:ci .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t crm-ai-worker:ci .
      - name: Build migration image
        run: docker build -f apps/api/Dockerfile.migrate -t crm-ai-migration:ci .
      - name: Verify migration image excludes dev tooling
        run: |
          docker run --rm crm-ai-migration:ci node -e "try { require.resolve('drizzle-kit'); console.error('drizzle-kit must not ship in the production migration image'); process.exit(1); } catch { console.log('production migration image excludes drizzle-kit'); }"
      - name: Audit migration production dependencies
        run: docker run --rm crm-ai-migration:ci npm audit --omit=dev --audit-level=high
